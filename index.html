<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マンション管理士 オリジナル問題集</title>
<style>
:root{--bg:#FFF9F1;--card:#FFFFFF;--text:#3A3049;--muted:#8A7F95;--border:#F0E3D3;--bp:#6255D8;--ok:#0BA58F;--ng:#E5536B;--shadow:0 6px 18px rgba(163,116,76,.10)}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:linear-gradient(180deg,#FFF8EE 0%,#FFF3F5 45%,#F4F6FF 100%);background-attachment:fixed;color:var(--text);line-height:1.65}
#app{max-width:880px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 2px}
h2{font-size:20px;margin:4px 0 8px}
.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card{background:var(--card);border:2px solid var(--border);border-radius:24px;padding:22px;margin-top:14px;box-shadow:var(--shadow)}
.btn{border:2px solid var(--border);background:#fff;border-radius:999px;padding:9px 18px;cursor:pointer;font:inherit;font-weight:700;color:var(--text);box-shadow:0 3px 0 rgba(163,116,76,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(163,116,76,.18)}
.btn.primary{background:var(--bp);color:#fff;border-color:var(--bp)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.pbar{height:12px;background:#F3E9DA;border-radius:999px;overflow:hidden;margin:6px 0}
.pbar>i{display:block;height:100%;background:var(--bp);border-radius:999px}
.pbar.ok>i{background:var(--ok)}
.meta{color:var(--muted);font-size:13px}
.stem{font-size:18px;font-weight:700;margin:8px 0 12px;white-space:pre-wrap}
.choices{display:grid;gap:10px;margin:12px 0}
.choice{text-align:left;border:2px solid var(--border);background:#fff;border-radius:18px;padding:12px 14px;cursor:pointer;font:inherit;min-height:48px;width:100%}
.choice.sel{border-color:var(--bp);background:#F1EFFF}
.choice.right{border-color:var(--ok);background:#EAFBF6}
.choice.wrong{border-color:var(--ng);background:#FDEEF1}
.choice:disabled{cursor:default;opacity:.92}
.expl{border-top:2px dashed var(--border);margin-top:14px;padding-top:12px}
.expl .verdict{font-weight:800;font-size:18px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.optline{margin:8px 0;padding:10px 12px;border-radius:14px;background:#FBF7F0;font-size:15px}
.optline .tag{font-weight:800;margin-right:6px}
.optline .tag.t{color:var(--ok)}.optline .tag.f{color:var(--ng)}
.basis{font-size:13px;color:var(--muted);margin-top:10px}
.basis li{margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:12px 0}
.grid button{border:2px solid var(--border);background:#fff;border-radius:10px;padding:6px 0;cursor:pointer;font:inherit;font-weight:700}
.grid button.done{background:#EDEBFF}
.grid button.right{background:#D8F5EE;border-color:var(--ok)}
.grid button.wrong{background:#FBDCE2;border-color:var(--ng)}
.grid button.now{outline:3px solid var(--bp)}
.timer{font-weight:800;font-size:18px}
.fieldbar{margin:8px 0}
.fieldbar .fname{font-size:13px;font-weight:700}
.score-big{font-size:32px;font-weight:800}
.notice{font-size:12px;color:var(--muted);margin-top:16px}
.countdown{margin-top:8px;border-radius:24px;padding:16px 20px;background:linear-gradient(135deg,#6255D8 0%,#8F6BE8 60%,#E58AB0 100%);color:#fff;box-shadow:var(--shadow)}
.countdown .cd-main{font-size:24px;font-weight:800;line-height:1.3}
.countdown .cd-main b{font-size:34px;margin:0 2px}
.countdown .cd-sub{font-size:14px;opacity:.95;margin-top:2px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mode{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);font-size:14px}
.mode .mname{font-weight:800;color:var(--bp);font-size:15px}
.summary-wrap{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:16px;align-items:start}
.radar{width:100%;max-width:320px;aspect-ratio:1/1;display:block;margin:0 auto}
.ftable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.ftable th,.ftable td{padding:5px 4px;border-bottom:1px dashed var(--border);text-align:right}
.ftable th:first-child,.ftable td:first-child{text-align:left}
.prob{margin-top:12px;padding:12px 14px;border-radius:18px;background:#F1EFFF}
.prob .pnum{font-size:28px;font-weight:800;color:var(--bp)}
.small{font-size:12px;color:var(--muted)}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.fbtn{text-align:left;border:2px solid var(--border);background:#fff;border-radius:18px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--text);box-shadow:0 3px 0 rgba(163,116,76,.18)}
.fbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(163,116,76,.18)}
.fbtn .fn{font-weight:800;display:block}
.ichi-stmt{font-size:17px;font-weight:700;margin:10px 0;padding:14px;border-radius:18px;background:#FBF7F0;white-space:pre-wrap}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .btn{font-size:22px;padding:10px 0}
details.ctx{font-size:13px;color:var(--muted);margin-top:6px}
@media (max-width:600px){
  .modes,.fbtns{grid-template-columns:1fr}
  .summary-wrap{grid-template-columns:1fr}
  .countdown .cd-main{font-size:20px}
  .countdown .cd-main b{font-size:28px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
"use strict";
const app = document.getElementById("app");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DATA = window.EXAM_DATA;
const store = {
  get(k, dflt) { try { const v = localStorage.getItem("kanrishi:" + k); return v ? JSON.parse(v) : dflt; } catch (e) { return dflt; } },
  set(k, v) { try { localStorage.setItem("kanrishi:" + k, JSON.stringify(v)); } catch (e) {} }
};
let view = { name: "home" };

function setData(n) { return DATA.sets.find((s) => s.set === n); }
function records(n) { return store.get("rec" + n, {}); } // {qid: pickedNo}
function savePick(n, qid, picked) { const r = records(n); r[qid] = picked; store.set("rec" + n, r); }

function progressOf(n) {
  const qs = setData(n).questions, r = records(n);
  let answered = 0, correct = 0;
  const byField = {};
  for (const q of qs) {
    const f = byField[q.field] || (byField[q.field] = { name: q.field_name, total: 0, answered: 0, correct: 0 });
    f.total++;
    if (r[q.id] != null) { answered++; f.answered++; if (r[q.id] === q.answer) { correct++; f.correct++; } }
  }
  return { answered, correct, total: qs.length, byField };
}

// ===== 機能追加 v1：定数・分野マッピング =====
// 試験日（日付の定数のみ。残り日数は表示のたびに端末の現在日時から算出する）
const EXAM_DATE = { y: 2026, m: 11, d: 29 };
const PASS_LINE = 40; // 合格目安ライン（令和7年度42点・令和6年度37点）
// 公式4分野（weight＝本試験の配点。サイト収録問題の配分 23/7/15/5 に一致）
const OFFICIAL_FIELDS = [
  { id: 1, name: "管理に関する法令及び実務", short: "法令・実務", weight: 23 },
  { id: 2, name: "管理組合の運営の円滑化", short: "運営の円滑化", weight: 7 },
  { id: 3, name: "建物及び附属施設の構造及び設備", short: "建物・設備", weight: 15 },
  { id: 4, name: "マンション管理の適正化の推進に関する法律", short: "適正化法", weight: 5 }
];
// set4（頻出問題コーナー）の表示カテゴリ（field_name）→ 公式分野
const SET4_CATEGORY_TO_FIELD = {
  "区分所有法等": 1, "標準管理規約": 1, "民法・その他法令": 1,
  "建築・設備": 3, "会計": 2, "マンション管理適正化法": 4, "適正化法": 4
};
// 問題 → 公式分野ID。本編（set1〜3）は既存の field をそのまま使う
function officialField(q) {
  if (q.set === 4) return SET4_CATEGORY_TO_FIELD[q.field_name] || null;
  return q.field;
}
const ALL_QUESTIONS = DATA.sets.flatMap((s) => s.questions);
const Q_POS = {}; // qid → 回の中での問番号（1始まり）
for (const s of DATA.sets) s.questions.forEach((q, i) => { Q_POS[q.id] = i + 1; });
function sourceLabel(q) { const s = setData(q.set); return (s ? s.title : "") + "・問" + Q_POS[q.id]; }

// 既存の学習記録（kanrishi:rec{回} = {qid: 選んだ肢番号}）を全回まとめて読む
function allRecords() { const m = {}; for (const s of DATA.sets) m[s.set] = records(s.set); return m; }
function pickOf(recs, q) { const r = recs[q.set]; return r ? r[q.id] : undefined; }

// 公式分野別の集計（解いた数／全問題数／正解数）
function officialStats() {
  const recs = allRecords();
  const st = {};
  for (const f of OFFICIAL_FIELDS) st[f.id] = { ...f, total: 0, answered: 0, correct: 0 };
  for (const q of ALL_QUESTIONS) {
    const f = st[officialField(q)];
    if (!f) continue;
    f.total++;
    const p = pickOf(recs, q);
    if (p != null) { f.answered++; if (p === q.answer) f.correct++; }
  }
  return OFFICIAL_FIELDS.map((f) => st[f.id]);
}

// JST基準の「試験日 − 今日」の日数（呼び出すたびに現在日時から計算）
function daysUntilExam() {
  const now = new Date();
  const jst = new Date(now.getTime() + 9 * 3600 * 1000); // UTC+9 に寄せて UTC getter で JST の日付を得る
  const today = Date.UTC(jst.getUTCFullYear(), jst.getUTCMonth(), jst.getUTCDate());
  const exam = Date.UTC(EXAM_DATE.y, EXAM_DATE.m - 1, EXAM_DATE.d);
  return Math.round((exam - today) / 86400000);
}

function countdownHtml() {
  const d = daysUntilExam();
  let main, sub;
  if (d > 0) {
    main = "試験まであと<b>" + d + "</b>日！";
    sub = d >= 14 ? "コツコツ積み上げていきましょう" : d >= 7 ? "仕上げの時期です。苦手分野を潰しましょう" : "ラストスパート！";
  } else if (d === 0) { main = "今日が試験日！"; sub = "落ち着いて、いつも通りで大丈夫"; }
  else { main = "試験お疲れさまでした"; sub = "ここまでの積み重ね、本当にお疲れさまでした。"; }
  return "<div class='countdown'><div class='cd-main'>" + main + "</div><div class='cd-sub'>" + esc(sub)
    + "　<span style='opacity:.85'>（本試験 " + EXAM_DATE.y + "年" + EXAM_DATE.m + "月" + EXAM_DATE.d + "日）</span></div></div>";
}

function modesHtml() {
  return "<div class='modes'>"
    + "<div class='mode'><div class='mname'>練習モード</div>1問ごとにすぐ答え合わせができます。解説を読みながら自分のペースで進められます。</div>"
    + "<div class='mode'><div class='mname'>模試モード</div>本番と同じ50問・120分です。時間を計って実力試しができます。</div>"
    + "</div>";
}

// 推定得点（50点満点）＝ Σ 配点 × [ カバー率 × 正答率 ＋ (1 − カバー率) × 0.25 ]
function estimateScore(stats) {
  let sum = 0;
  for (const f of stats) {
    const cov = f.total ? f.answered / f.total : 0;
    const acc = f.answered ? f.correct / f.answered : 0;
    sum += f.weight * (cov * acc + (1 - cov) * 0.25);
  }
  return sum;
}
function passProbLabel(diff) {
  if (diff >= 6) return "90%前後";
  if (diff >= 3) return "75%前後";
  if (diff >= 0) return "55%前後";
  if (diff >= -3) return "35%前後";
  if (diff >= -6) return "20%前後";
  return "10%未満";
}

function summaryHtml(stats) {
  const any = stats.some((f) => f.answered > 0);
  let rows = "";
  for (const f of stats) {
    rows += "<tr><td>" + esc(f.short) + "</td><td>" + f.answered + " / " + f.total + "問</td><td>"
      + (f.answered ? Math.round((f.correct / f.answered) * 100) + "%" : "未挑戦") + "</td></tr>";
  }
  let prob;
  if (!any) {
    prob = "<div class='prob'><b>合格確率の目安</b><div style='margin-top:4px'>まだデータがありません。まず1問解いてみましょう</div></div>";
  } else {
    const est = estimateScore(stats), diff = est - PASS_LINE;
    prob = "<div class='prob'><b>合格確率の目安</b><div class='pnum'>" + passProbLabel(diff) + "</div>"
      + "<div style='font-size:14px'>推定得点 <b>" + est.toFixed(1) + "点</b> / 50点　目安ライン" + PASS_LINE + "点（年度により37〜42点で変動）"
      + "　差 " + (diff >= 0 ? "+" : "") + diff.toFixed(1) + "点</div>"
      + "<div class='small' style='margin-top:6px'>推定得点は、分野ごとに「本試験の配点（23／7／15／5点）×［カバー率×正答率＋（1−カバー率）×25%］」を合計したものです。カバー率＝その分野で解いた問題数÷収録問題数。まだ解いていない分は4択の当てずっぽう（25%）として保守的に見積もっています。</div>"
      + "<div class='small' style='margin-top:4px'>※ あくまで目安です。このサイトの問題での正答率から計算した簡易推定で、実際の合否を保証するものではありません</div></div>";
  }
  return "<div class='card'><h2>成績サマリー</h2><div class='summary-wrap'>"
    + "<canvas id='radar' class='radar' aria-label='分野別正答率のレーダーチャート'></canvas>"
    + "<div><table class='ftable'><thead><tr><th>分野</th><th>解いた数／全問題数</th><th>正答率</th></tr></thead><tbody>" + rows + "</tbody></table>"
    + "<div class='small' style='margin-top:6px'>全回（第1回〜第3回＋頻出問題コーナー）の練習・模試の最新結果から集計しています。頻出問題コーナーは、区分所有法等・標準管理規約・民法・その他法令→法令・実務、建築・設備→建物・設備、会計→運営の円滑化、適正化法→適正化法として集計します。</div></div>"
    + "</div>" + prob + "</div>";
}

// Canvas に自前描画するレーダーチャート（値＝分野別正答率。未挑戦は0）
function drawRadar(stats) {
  const cv = document.getElementById("radar");
  if (!cv) return;
  const cssW = cv.clientWidth || 300, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssW * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cssW, cx = W / 2, cy = W / 2, R = W * 0.3, n = stats.length;
  const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / n;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
  ctx.clearRect(0, 0, W, W);
  ctx.lineWidth = 1;
  for (let k = 1; k <= 4; k++) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const [x, y] = pt(i, (R * k) / 4); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.strokeStyle = k === 4 ? "#E2D3BF" : "#F0E3D3"; ctx.stroke();
  }
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, R); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.strokeStyle = "#F0E3D3"; ctx.stroke(); }
  ctx.fillStyle = "#8A7F95"; ctx.font = "10px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  for (let k = 1; k <= 4; k++) ctx.fillText(k * 25 + "%", cx + 3, cy - (R * k) / 4);
  const vals = stats.map((f) => (f.answered ? f.correct / f.answered : 0));
  ctx.beginPath();
  vals.forEach((v, i) => { const [x, y] = pt(i, R * v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath(); ctx.fillStyle = "rgba(98,85,216,.25)"; ctx.fill(); ctx.strokeStyle = "#6255D8"; ctx.lineWidth = 2; ctx.stroke();
  vals.forEach((v, i) => { const [x, y] = pt(i, R * v); ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fillStyle = "#6255D8"; ctx.fill(); });
  // 軸ラベル（分野名＋正答率）。キャンバス端で切れないよう横位置を収める
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  stats.forEach((f, i) => {
    const c = Math.cos(ang(i)), sn = Math.sin(ang(i));
    const label2 = f.answered ? Math.round(vals[i] * 100) + "%" : "未挑戦";
    ctx.font = "bold 12px sans-serif";
    const w = Math.max(ctx.measureText(f.short).width, ctx.measureText(label2).width);
    let [x, y] = pt(i, R + 14);
    if (Math.abs(c) >= 0.2) x += (c > 0 ? 1 : -1) * w / 2;
    x = Math.min(W - w / 2 - 2, Math.max(w / 2 + 2, x));
    const dy = sn < -0.5 ? -14 : sn > 0.5 ? 2 : -7;
    ctx.fillStyle = "#3A3049"; ctx.fillText(f.short, x, y + dy);
    ctx.font = "11px sans-serif"; ctx.fillStyle = "#8A7F95"; ctx.fillText(label2, x, y + dy + 14);
  });
}

function fieldCornerHtml(stats) {
  let h = "<div class='card'><h2>分野別でやりたい場合はこちら</h2><div class='meta'>その分野の問題だけを全回から集めてシャッフルし、練習モードと同じ形式（即時採点＋全肢解説）で出題します。記録は各回の学習記録に保存されます。</div><div class='fbtns'>";
  for (const f of stats) {
    h += "<button class='fbtn' data-act='fieldpractice' data-field='" + f.id + "'><span class='fn'>" + esc(f.name) + "</span>"
      + "<span class='meta'>収録 " + f.total + "問　あなたの正答率 " + (f.answered ? Math.round((f.correct / f.answered) * 100) + "%（" + f.answered + "問中）" : "未挑戦") + "</span></button>";
  }
  return h + "</div></div>";
}

// ===== 一問一答（記録は画面内のみ） =====
let ichi = null; // { q, i, ans }
const ichiScore = { n: 0, ok: 0 };
function newIchi() {
  const q = ALL_QUESTIONS[Math.floor(Math.random() * ALL_QUESTIONS.length)];
  ichi = { q, i: Math.floor(Math.random() * q.options.length), ans: null };
}
function ichiInner() {
  if (!ichi) newIchi();
  const q = ichi.q, i = ichi.i, opt = q.explanation.options[i];
  const truth = !!opt.correct; // 正誤の基準：その肢の記述自体が正しいか（correct フラグ）
  let h = "<div class='row spread'><span class='meta'>この文は正しい？</span>"
    + (ichiScore.n ? "<span class='meta'>今回の成績 " + ichiScore.ok + " / " + ichiScore.n + "問</span>" : "") + "</div>"
    + "<div class='ichi-stmt'>" + esc(q.options[i]) + "</div>";
  if (ichi.ans == null) {
    h += "<details class='ctx'><summary>前提を確認したいとき（元の問題文）</summary>" + esc(q.question) + "</details>"
      + "<div class='ox' style='margin-top:10px'><button class='btn' data-act='ichi' data-v='o'>○</button><button class='btn' data-act='ichi' data-v='x'>×</button></div>";
  } else {
    const ok = ichi.ans === truth;
    h += "<div class='expl'><div class='verdict " + (ok ? "ok" : "ng") + "'>" + (ok ? "正解！" : "不正解…") + "　答えは " + (truth ? "○（正しい文）" : "×（誤った文）") + "</div>"
      + "<div class='optline'><span class='tag " + (truth ? "t" : "f") + "'>" + (truth ? "○" : "×") + "</span>" + esc(opt.text) + "</div>"
      + "<div class='basis'><b>出典：" + esc(sourceLabel(q)) + "</b>（分野：" + esc(q.field_name) + "　テーマ：" + esc(q.theme) + "）<br>"
      + "問題文：" + esc(q.question) + "<br>要約：" + esc(q.explanation.summary) + "</div></div>"
      + "<div class='row' style='margin-top:12px'><button class='btn primary' data-act='ichinext'>次の問題 →</button></div>";
  }
  return h;
}
function ichiHtml() {
  return "<div class='card'><h2>一問一答コーナー</h2><div class='meta'>収録問題の選択肢から1つをランダムに出題します。その文が正しいか○×で答えましょう（「誤っているもの」を選ぶ問題の正解肢は×になります）。</div><div id='ichi'>" + ichiInner() + "</div></div>";
}
function refreshIchi() { const el = document.getElementById("ichi"); if (el) el.innerHTML = ichiInner(); }

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// 練習エンジンが扱う問題リスト（回単位 or 分野別）
function practiceList() { return view.list || setData(view.set).questions; }
function progressOfList(qs) {
  const recs = allRecords(); let answered = 0, correct = 0;
  for (const q of qs) { const p = pickOf(recs, q); if (p != null) { answered++; if (p === q.answer) correct++; } }
  return { answered, correct, total: qs.length };
}

function render() {
  if (view.name === "home") return renderHome();
  if (view.name === "practice") return renderPractice();
  if (view.name === "exam") return renderExam();
  if (view.name === "result") return renderResult();
}

function renderHome() {
  const stats = officialStats();
  let h = countdownHtml()
    + "<h1>マンション管理士 オリジナル問題集</h1><div class='sub'>本試験形式（50問・四肢択一）のオリジナル問題です。直近の法改正・判例を中心に、本試験よりかなり難しめに作っています。</div>"
    + modesHtml() + summaryHtml(stats);
  for (const s of DATA.sets) {
    const p = progressOf(s.set);
    const pct = p.total ? Math.round((p.answered / p.total) * 100) : 0;
    const acc = p.answered ? Math.round((p.correct / p.answered) * 100) : 0;
    h += "<div class='card'><h2>" + esc(s.title) + "（全" + p.total + "問）</h2>"
      + "<div class='meta'>解いた問題 " + p.answered + " / " + p.total + "問　正解 " + p.correct + "問" + (p.answered ? "（正答率 " + acc + "%）" : "") + "</div>"
      + "<div class='pbar'><i style='width:" + pct + "%'></i></div>";
    for (const f of Object.values(p.byField)) {
      const fp = f.total ? Math.round((f.answered / f.total) * 100) : 0;
      h += "<div class='fieldbar'><span class='fname'>" + esc(f.name) + "</span> <span class='meta'>" + f.answered + "/" + f.total + "問・正解" + f.correct + "</span><div class='pbar ok'><i style='width:" + fp + "%'></i></div></div>";
    }
    h += "<div class='row' style='margin-top:10px'>"
      + "<button class='btn primary' data-act='practice' data-set='" + s.set + "'>" + (p.answered ? "練習のつづき" : "練習モード") + "</button>"
      + "<button class='btn' data-act='exam' data-set='" + s.set + "'>模試モード（120分）</button>"
      + (p.answered ? "<button class='btn' data-act='reset' data-set='" + s.set + "'>記録をリセット</button>" : "")
      + "</div></div>";
  }
  h += fieldCornerHtml(stats) + ichiHtml();
  h += "<div class='notice'>非公式の学習用サイトです。マンション管理業協会および公式試験とは無関係です。問題はすべてオリジナルで、解説には根拠条文を付けています。学習記録はこの端末の中だけに保存されます。</div>";
  app.innerHTML = h;
  drawRadar(stats);
}

function explanationHtml(q, picked) {
  const ok = picked === q.answer;
  let h = "<div class='expl'><div class='verdict " + (ok ? "ok" : "ng") + "'>" + (ok ? "正解！" : "不正解…") + "　正解は " + q.answer + "</div>"
    + "<p>" + esc(q.explanation.summary) + "</p>";
  for (const o of q.explanation.options) {
    h += "<div class='optline'><span class='tag " + (o.correct ? "t" : "f") + "'>" + o.no + (o.correct ? " ○（記述は正しい）" : " ×（記述は誤り）") + "</span>" + esc(o.text) + "</div>";
  }
  if (q.explanation.legal_basis && q.explanation.legal_basis.length) {
    h += "<div class='basis'>根拠：<ul>" + q.explanation.legal_basis.map((b) => "<li>" + esc(b) + "</li>").join("") + "</ul></div>";
  }
  return h + "</div>";
}

function renderPractice() {
  const qs = practiceList(), q = qs[view.idx];
  const recs = allRecords(), picked = pickOf(recs, q);
  const p = progressOfList(qs);
  const title = view.list ? "分野別：" + view.listTitle : setData(view.set).title;
  let h = "<div class='row spread'><button class='btn' data-act='home'>← もどる</button><span class='meta'>" + esc(title) + "　" + (view.idx + 1) + " / " + qs.length + "問　正解 " + p.correct + "問</span></div>"
    + "<div class='pbar'><i style='width:" + Math.round((p.answered / p.total) * 100) + "%'></i></div>"
    + "<div class='card'><div class='meta'>" + (view.list ? "出典：" + esc(sourceLabel(q)) + "　" : "") + "分野：" + esc(q.field_name) + "　テーマ：" + esc(q.theme) + "</div>"
    + "<div class='stem'>問" + (view.idx + 1) + "　" + esc(q.question) + "</div><div class='choices'>";
  q.options.forEach((opt, i) => {
    const no = i + 1;
    let cls = "choice";
    if (picked != null) { if (no === q.answer) cls += " right"; else if (no === picked) cls += " wrong"; }
    else if (view.sel === no) cls += " sel";
    h += "<button class='" + cls + "' data-pick='" + no + "'" + (picked != null ? " disabled" : "") + ">" + no + "．" + esc(opt) + "</button>";
  });
  h += "</div>";
  if (picked != null) h += explanationHtml(q, picked);
  h += "<div class='row spread' style='margin-top:14px'><button class='btn' data-act='prev'" + (view.idx === 0 ? " disabled" : "") + ">← 前の問題</button>"
    + "<button class='btn primary' data-act='next'" + (view.idx === qs.length - 1 ? " disabled" : "") + ">次の問題 →</button></div></div>"
    + "<div class='card'><div class='meta'>問題一覧（タップで移動）</div><div class='grid'>"
    + qs.map((x, i) => {
        const rp = pickOf(recs, x);
        const cls = rp == null ? "" : (rp === x.answer ? "right" : "wrong");
        return "<button data-jump='" + i + "' class='" + cls + (i === view.idx ? " now" : "") + "'>" + (i + 1) + "</button>";
      }).join("")
    + "</div></div>";
  app.innerHTML = h;
}

let examTimer = null;
function renderExam() {
  const s = setData(view.set), qs = s.questions, q = qs[view.idx];
  const a = view.answers;
  const left = Math.max(0, view.deadline - Date.now());
  const mm = String(Math.floor(left / 60000)), ss = String(Math.floor((left % 60000) / 1000)).padStart(2, "0");
  let h = "<div class='row spread'><span class='timer'>残り " + mm + ":" + ss + "</span><span class='meta'>模試モード　" + esc(s.title) + "　回答済み " + Object.keys(a).length + " / " + qs.length + "</span><button class='btn primary' data-act='finish'>採点する</button></div>"
    + "<div class='card'><div class='meta'>分野：" + esc(q.field_name) + "</div>"
    + "<div class='stem'>問" + (view.idx + 1) + "　" + esc(q.question) + "</div><div class='choices'>";
  q.options.forEach((opt, i) => {
    const no = i + 1;
    h += "<button class='choice" + (a[q.id] === no ? " sel" : "") + "' data-epick='" + no + "'>" + no + "．" + esc(opt) + "</button>";
  });
  h += "</div><div class='row spread' style='margin-top:14px'><button class='btn' data-act='prev'" + (view.idx === 0 ? " disabled" : "") + ">← 前の問題</button>"
    + "<button class='btn' data-act='next'" + (view.idx === qs.length - 1 ? " disabled" : "") + ">次の問題 →</button></div></div>"
    + "<div class='card'><div class='meta'>マークシート（タップで移動）</div><div class='grid'>"
    + qs.map((x, i) => "<button data-jump='" + i + "' class='" + (a[x.id] != null ? "done" : "") + (i === view.idx ? " now" : "") + "'>" + (i + 1) + "</button>").join("")
    + "</div></div>";
  app.innerHTML = h;
}

function renderResult() {
  const s = setData(view.set), qs = s.questions, a = view.answers;
  let correct = 0; const byField = {};
  for (const q of qs) {
    const f = byField[q.field] || (byField[q.field] = { name: q.field_name, total: 0, correct: 0 });
    f.total++; if (a[q.id] === q.answer) { correct++; f.correct++; }
  }
  let h = "<div class='card'><h2>模試の結果（" + esc(s.title) + "）</h2><div class='score-big'>" + correct + " / " + qs.length + " 点</div>"
    + "<div class='meta'>正答率 " + Math.round((correct / qs.length) * 100) + "%</div>";
  for (const f of Object.values(byField)) h += "<div class='fieldbar'><span class='fname'>" + esc(f.name) + "</span> <span class='meta'>" + f.correct + "/" + f.total + "</span><div class='pbar ok'><i style='width:" + Math.round((f.correct / f.total) * 100) + "%'></i></div></div>";
  h += "<div class='row' style='margin-top:12px'><button class='btn primary' data-act='home'>トップへもどる</button></div></div>";
  qs.forEach((q, i) => {
    const picked = a[q.id];
    h += "<div class='card'><div class='meta'>問" + (i + 1) + "　分野：" + esc(q.field_name) + "</div><div class='stem'>" + esc(q.question) + "</div><div class='choices'>"
      + q.options.map((opt, j) => {
          const no = j + 1;
          let cls = "choice";
          if (no === q.answer) cls += " right"; else if (no === picked) cls += " wrong";
          return "<button class='" + cls + "' disabled>" + no + "．" + esc(opt) + "</button>";
        }).join("")
      + "</div>" + (picked == null ? "<div class='expl'><div class='verdict ng'>未回答　正解は " + q.answer + "</div><p>" + esc(q.explanation.summary) + "</p>"
          + q.explanation.options.map((o) => "<div class='optline'><span class='tag " + (o.correct ? "t" : "f") + "'>" + o.no + (o.correct ? " ○" : " ×") + "</span>" + esc(o.text) + "</div>").join("")
          + (q.explanation.legal_basis && q.explanation.legal_basis.length ? "<div class='basis'>根拠：<ul>" + q.explanation.legal_basis.map((b) => "<li>" + esc(b) + "</li>").join("") + "</ul></div>" : "") + "</div>"
        : explanationHtml(q, picked))
      + "</div>";
  });
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-pick],[data-epick],[data-jump]");
  if (!t) return;
  if (t.dataset.jump != null) { view.idx = Number(t.dataset.jump); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.pick != null) {
    const q = practiceList()[view.idx];
    savePick(q.set, q.id, Number(t.dataset.pick));
    render(); return;
  }
  if (t.dataset.epick != null) {
    const s = setData(view.set), q = s.questions[view.idx];
    view.answers[q.id] = Number(t.dataset.epick);
    render(); return;
  }
  const act = t.dataset.act;
  if (act === "home") { if (examTimer) { clearInterval(examTimer); examTimer = null; } view = { name: "home" }; render(); }
  else if (act === "practice") {
    const n = Number(t.dataset.set), r = records(n), qs = setData(n).questions;
    let idx = qs.findIndex((q) => r[q.id] == null); if (idx < 0) idx = 0;
    view = { name: "practice", set: n, idx }; render(); window.scrollTo(0, 0);
  }
  else if (act === "exam") {
    const n = Number(t.dataset.set);
    view = { name: "exam", set: n, idx: 0, answers: {}, deadline: Date.now() + 120 * 60000 };
    if (examTimer) clearInterval(examTimer);
    examTimer = setInterval(() => { if (view.name === "exam") render(); }, 1000);
    render(); window.scrollTo(0, 0);
  }
  else if (act === "fieldpractice") {
    const fid = Number(t.dataset.field), f = OFFICIAL_FIELDS.find((x) => x.id === fid);
    const list = shuffle(ALL_QUESTIONS.filter((q) => officialField(q) === fid));
    const recs = allRecords();
    let idx = list.findIndex((q) => pickOf(recs, q) == null); if (idx < 0) idx = 0;
    view = { name: "practice", list, listTitle: f.short, idx }; render(); window.scrollTo(0, 0);
  }
  else if (act === "ichi") {
    if (ichi && ichi.ans == null) {
      ichi.ans = t.dataset.v === "o";
      ichiScore.n++; if (ichi.ans === !!ichi.q.explanation.options[ichi.i].correct) ichiScore.ok++;
    }
    refreshIchi();
  }
  else if (act === "ichinext") { newIchi(); refreshIchi(); }
  else if (act === "reset") { store.set("rec" + t.dataset.set, {}); render(); }
  else if (act === "prev") { view.idx--; render(); window.scrollTo(0, 0); }
  else if (act === "next") { view.idx++; render(); window.scrollTo(0, 0); }
  else if (act === "finish") {
    if (examTimer) { clearInterval(examTimer); examTimer = null; }
    const ans = view.answers;
    for (const q of setData(view.set).questions) if (ans[q.id] != null) savePick(view.set, q.id, ans[q.id]);
    view = { name: "result", set: view.set, answers: ans }; render();
  }
});
window.addEventListener("resize", () => { if (view.name === "home") drawRadar(officialStats()); });
render();
</script>
</body>
</html>
